name: Build Python 3.13 release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - requirements-layer.txt
      - lambda_function.py
      - gw2pvo/gw_api.py
      - gw2pvo/pvo_api.py
      - RELEASE_NOTES.md
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build packages
        shell: bash
        run: |
          set -eux
          VERSION="$(tr -d '[:space:]' < VERSION)"
          rm -rf build
          mkdir -p build/layer/python/gw2pvo build/function
          python -m pip install --upgrade pip
          python -m pip install -r requirements-layer.txt -t build/layer/python
          cp gw2pvo/gw_api.py gw2pvo/pvo_api.py build/layer/python/gw2pvo/
          touch build/layer/python/gw2pvo/__init__.py
          cp lambda_function.py build/function/
          (cd build/layer && zip -qr "../../gw2pvo-layer-$VERSION.zip" python)
          (cd build/function && zip -qr "../../GW2PVO-$VERSION.zip" .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PRERELEASE=""
          case "$VERSION" in
            *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;;
          esac

          # RELEASE_NOTES.md: the first "## " heading is the release title,
          # the rest is the description.
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          TITLE="Python 3.13 ($VERSION)"
          if [ -s RELEASE_NOTES.md ]; then
            HEADING="$(grep -m1 '^## ' RELEASE_NOTES.md | sed 's/^## *//')"
            [ -n "$HEADING" ] && TITLE="$HEADING"
            sed '0,/^## /{/^## /d}' RELEASE_NOTES.md > "$NOTES_FILE"
          else
            echo "Python 3.13 Lambda build with SEMS+ GoodWe API." > "$NOTES_FILE"
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$TITLE" $PRERELEASE --notes-file "$NOTES_FILE"
          else
            gh release edit "$VERSION" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi
          gh release upload "$VERSION" "gw2pvo-layer-$VERSION.zip" "GW2PVO-$VERSION.zip" --clobber
